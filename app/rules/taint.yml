rules:
  # =====================================================================
  # Taint 模式規則：追蹤 source → sink 的資料流。
  #
  # 這些規則和 default.yml / 各語言規則互補：
  #   * pattern 規則只問「這裡有沒有危險 API」
  #   * taint 規則額外要求「使用者可控資料是否真的流到這裡」
  #
  # Semgrep OSS 的 taint 分析以單一檔案、函式內為主；跨檔案／跨程序
  # 的完整追蹤需要 Semgrep Pro（SAST_SEMGREP_PRO=true）。
  # =====================================================================

  # ===================== Python =====================
  - id: python-taint-command-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: 使用者可控資料流入 shell／命令執行 API，可能造成命令注入（taint 追蹤）。
    metadata:
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
      category: security
      confidence: MEDIUM
      technology: [flask, django, fastapi]
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.args[...]
          - pattern: request.form.get(...)
          - pattern: request.form[...]
          - pattern: request.values.get(...)
          - pattern: request.values[...]
          - pattern: request.json.get(...)
          - pattern: request.json[...]
          - pattern: request.get_json(...)
          - pattern: request.GET.get(...)
          - pattern: request.GET[...]
          - pattern: request.POST.get(...)
          - pattern: request.POST[...]
          - pattern: request.query_params.get(...)
          - pattern: request.query_params[...]
          - pattern: input(...)
          - pattern: sys.argv[...]
    pattern-sinks:
      - patterns:
          - pattern: os.system($CMD)
          - focus-metavariable: $CMD
      - patterns:
          - pattern: os.popen($CMD, ...)
          - focus-metavariable: $CMD
      - patterns:
          - pattern: subprocess.run($CMD, ..., shell=True, ...)
          - focus-metavariable: $CMD
      - patterns:
          - pattern: subprocess.call($CMD, ..., shell=True, ...)
          - focus-metavariable: $CMD
      - patterns:
          - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
          - focus-metavariable: $CMD
      - patterns:
          - pattern: subprocess.check_output($CMD, ..., shell=True, ...)
          - focus-metavariable: $CMD
      - patterns:
          - pattern: subprocess.check_call($CMD, ..., shell=True, ...)
          - focus-metavariable: $CMD
    pattern-sanitizers:
      - pattern-either:
          - pattern: shlex.quote(...)
          - pattern: int(...)
          - pattern: float(...)
          - pattern: bool(...)

  - id: python-taint-sql-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: 使用者可控資料被拼進 SQL 語句，可能造成 SQL injection（taint 追蹤）。
    metadata:
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command"]
      category: security
      confidence: MEDIUM
      technology: [flask, django, fastapi]
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.args[...]
          - pattern: request.form.get(...)
          - pattern: request.form[...]
          - pattern: request.values.get(...)
          - pattern: request.values[...]
          - pattern: request.json.get(...)
          - pattern: request.json[...]
          - pattern: request.get_json(...)
          - pattern: request.GET.get(...)
          - pattern: request.GET[...]
          - pattern: request.POST.get(...)
          - pattern: request.POST[...]
          - pattern: request.query_params.get(...)
          - pattern: request.query_params[...]
          - pattern: input(...)
    pattern-sinks:
      - patterns:
          - pattern: $CUR.execute($QUERY, ...)
          - focus-metavariable: $QUERY
      - patterns:
          - pattern: $CUR.executemany($QUERY, ...)
          - focus-metavariable: $QUERY
      - patterns:
          - pattern: $CUR.executescript($QUERY)
          - focus-metavariable: $QUERY
      - patterns:
          - pattern: sqlalchemy.text($QUERY)
          - focus-metavariable: $QUERY
    pattern-sanitizers:
      - pattern-either:
          - pattern: int(...)
          - pattern: float(...)

  - id: python-taint-path-traversal
    mode: taint
    languages: [python]
    severity: ERROR
    message: 使用者可控資料被當成檔案路徑，可能造成路徑穿越（taint 追蹤）。
    metadata:
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory"]
      category: security
      confidence: MEDIUM
      technology: [flask, django, fastapi]
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.args[...]
          - pattern: request.form.get(...)
          - pattern: request.form[...]
          - pattern: request.values.get(...)
          - pattern: request.values[...]
          - pattern: request.json.get(...)
          - pattern: request.json[...]
          - pattern: request.get_json(...)
          - pattern: request.GET.get(...)
          - pattern: request.GET[...]
          - pattern: request.POST.get(...)
          - pattern: request.POST[...]
          - pattern: request.query_params.get(...)
          - pattern: request.query_params[...]
          - pattern: input(...)
    pattern-sinks:
      - patterns:
          - pattern: open($PATH, ...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern: io.open($PATH, ...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern: Path($PATH).read_text(...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern: Path($PATH).read_bytes(...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern: shutil.copy($SRC, ...)
          - focus-metavariable: $SRC
      - patterns:
          - pattern: shutil.move($SRC, ...)
          - focus-metavariable: $SRC
      - patterns:
          - pattern: os.remove($PATH)
          - focus-metavariable: $PATH
      - patterns:
          - pattern: send_file($PATH, ...)
          - focus-metavariable: $PATH
    pattern-sanitizers:
      - pattern-either:
          - pattern: os.path.basename(...)
          - pattern: secure_filename(...)
          - pattern: Path(...).name

  - id: python-taint-ssrf
    mode: taint
    languages: [python]
    severity: ERROR
    message: 使用者可控資料被當成遠端 URL，可能造成 SSRF（taint 追蹤）。
    metadata:
      cwe: ["CWE-918: Server-Side Request Forgery"]
      category: security
      confidence: MEDIUM
      technology: [flask, django, fastapi]
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.args[...]
          - pattern: request.form.get(...)
          - pattern: request.form[...]
          - pattern: request.values.get(...)
          - pattern: request.values[...]
          - pattern: request.json.get(...)
          - pattern: request.json[...]
          - pattern: request.get_json(...)
          - pattern: request.GET.get(...)
          - pattern: request.GET[...]
          - pattern: request.POST.get(...)
          - pattern: request.POST[...]
          - pattern: request.query_params.get(...)
          - pattern: request.query_params[...]
    pattern-sinks:
      - patterns:
          - pattern: requests.get($URL, ...)
          - focus-metavariable: $URL
      - patterns:
          - pattern: requests.post($URL, ...)
          - focus-metavariable: $URL
      - patterns:
          - pattern: requests.request($METHOD, $URL, ...)
          - focus-metavariable: $URL
      - patterns:
          - pattern: httpx.get($URL, ...)
          - focus-metavariable: $URL
      - patterns:
          - pattern: httpx.post($URL, ...)
          - focus-metavariable: $URL
      - patterns:
          - pattern: urllib.request.urlopen($URL, ...)
          - focus-metavariable: $URL

  - id: python-taint-xss
    mode: taint
    languages: [python]
    severity: ERROR
    message: 使用者可控資料未經逃逸就輸出到 HTML，可能造成 XSS（taint 追蹤）。
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation"]
      category: security
      confidence: MEDIUM
      technology: [flask, django]
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.args[...]
          - pattern: request.form.get(...)
          - pattern: request.form[...]
          - pattern: request.values.get(...)
          - pattern: request.values[...]
          - pattern: request.json.get(...)
          - pattern: request.json[...]
          - pattern: request.get_json(...)
          - pattern: request.GET.get(...)
          - pattern: request.GET[...]
          - pattern: request.POST.get(...)
          - pattern: request.POST[...]
    pattern-sinks:
      - patterns:
          - pattern: Markup($X)
          - focus-metavariable: $X
      - patterns:
          - pattern: markupsafe.Markup($X)
          - focus-metavariable: $X
      - patterns:
          - pattern: render_template_string($X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: HttpResponse($X, ...)
          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern-either:
          - pattern: markupsafe.escape(...)
          - pattern: html.escape(...)
          - pattern: bleach.clean(...)
          - pattern: escape(...)

  - id: python-taint-code-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: 使用者可控資料被當成程式碼執行，可能造成遠端程式碼執行（taint 追蹤）。
    metadata:
      cwe: ["CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"]
      category: security
      confidence: MEDIUM
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.args[...]
          - pattern: request.form.get(...)
          - pattern: request.form[...]
          - pattern: request.values.get(...)
          - pattern: request.values[...]
          - pattern: request.json.get(...)
          - pattern: request.json[...]
          - pattern: request.get_json(...)
          - pattern: input(...)
          - pattern: sys.argv[...]
    pattern-sinks:
      - patterns:
          - pattern: eval($CODE)
          - focus-metavariable: $CODE
      - patterns:
          - pattern: exec($CODE)
          - focus-metavariable: $CODE

  # ===================== JavaScript / TypeScript =====================
  - id: js-taint-command-injection
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: 使用者可控資料流入 shell／命令執行 API，可能造成命令注入（taint 追蹤）。
    metadata:
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
      category: security
      confidence: MEDIUM
      technology: [express, node]
    pattern-sources:
      - pattern-either:
          - pattern: req.query[...]
          - pattern: req.query.$KEY
          - pattern: req.body[...]
          - pattern: req.body.$KEY
          - pattern: req.params[...]
          - pattern: req.params.$KEY
          - pattern: req.headers[...]
          - pattern: req.cookies[...]
          - pattern: request.query[...]
          - pattern: request.body[...]
          - pattern: request.params[...]
          - pattern: location.search
          - pattern: location.hash
          - pattern: document.URL
          - pattern: document.referrer
          - pattern: process.argv[...]
    pattern-sinks:
      - patterns:
          - pattern: child_process.exec($CMD, ...)
          - focus-metavariable: $CMD
      - patterns:
          - pattern: child_process.execSync($CMD, ...)
          - focus-metavariable: $CMD
      - patterns:
          - pattern: require("child_process").exec($CMD, ...)
          - focus-metavariable: $CMD
      - patterns:
          - pattern: require("child_process").execSync($CMD, ...)
          - focus-metavariable: $CMD
      - patterns:
          - pattern: "child_process.spawn($CMD, ..., {shell: true, ...})"
          - focus-metavariable: $CMD
      - patterns:
          - pattern: "child_process.execFile($CMD, ..., {shell: true, ...})"
          - focus-metavariable: $CMD
    pattern-sanitizers:
      - pattern-either:
          - pattern: parseInt(...)
          - pattern: parseFloat(...)
          - pattern: Number(...)

