      - patterns:
          - pattern: $RES.send($X)
          - focus-metavariable: $X
      - patterns:
          - pattern: $RES.write($X)
          - focus-metavariable: $X
      - patterns:
          - pattern: $RES.end($X)
          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern-either:
          - pattern: DOMPurify.sanitize(...)
          - pattern: sanitizeHtml(...)
          - pattern: escapeHtml(...)

