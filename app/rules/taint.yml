    languages: [javascript, typescript]
    severity: ERROR
    message: 使用者可控資料未經消毒就寫入 HTML，可能造成 XSS（taint 追蹤）。
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation"]
